name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip reviews for dependabot PRs
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # EcAuthDocs は private なので checkout に token が要る。GITHUB_TOKEN は自リポジトリ
      # にしか効かないため、contents: read を EcAuthDocs 1 つだけに絞った GitHub App
      # (EcAuth Docs Reader) の installation token を使う。秘密鍵は 1Password が一次情報で、
      # GitHub 側にはサービスアカウントトークンしか置かない。
      #
      # actions: write を持つ App (EcAuth Workflow Dispatcher) と分けてあるのは、この
      # ジョブが public リポジトリで issue 本文を LLM に読ませる構造だからで、仮に
      # プロンプトインジェクションが通っても最悪ケースが「EcAuthDocs を読む」= 本来の
      # 用途に留まる。1 つの App にまとめて発行時に絞る形では、鍵そのものが両方の権限を
      # 持つため、この境界は成立しない。
      # export-env は false（既定）にする。true にすると秘密鍵が $GITHUB_ENV 経由で
      # 後続の全ステップの環境変数に載り、Bash を許可された Claude 実行ステップから
      # `env` で読めてしまう。このジョブは issue / PR 本文という信頼できない入力を
      # LLM に渡すため、prompt injection で App の秘密鍵そのものを持ち出される経路に
      # なる。installation token は 1 時間で失効しジョブ終了時に revoke されるが、
      # 秘密鍵は長命で何度でもトークンを再発行できるため、露出の意味がまったく違う。
      # ステップ出力なら後続ステップの環境には載らず、明示的に参照した場所にだけ渡る。
      - name: Load GitHub App credentials from 1Password
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOCS_READER_CLIENT_ID: op://EcAuth/github-app-docs-reader/client_id
          DOCS_READER_PRIVATE_KEY: op://EcAuth/github-app-docs-reader/private_key
      - name: Create EcAuthDocs access token
        id: docs-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.op.outputs.DOCS_READER_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.DOCS_READER_PRIVATE_KEY }}
          owner: EcAuth
          # App は EcAuthDocs にしか install していないが、発行するトークン側でも対象と
          # 権限を明示する。install 先が将来増えても、この 2 行を直さない限りトークンの
          # 届く範囲は広がらない。
          repositories: EcAuthDocs
          permission-contents: read
      - name: Checkout EcAuthDocs repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EcAuth/EcAuthDocs
          path: docs
          fetch-depth: 1
          token: ${{ steps.docs-token.outputs.token }}
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Add GitHub Packages source with credentials
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source https://nuget.pkg.github.com/EcAuth/index.json \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Restore dependencies
        run: dotnet restore ./EcAuth.sln

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Use the repository's CLAUDE.md for guidance on style and conventions.
            日本語で回答してください。
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
