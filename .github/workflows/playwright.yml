name: Playwright E2E Tests - IdentityProvider

# Reusable workflow: main.yml から起動される。workflow_dispatch は Actions UI から
# このスイートを単体で再実行できるように残している。push / pull_request トリガーは
# main.yml に集約し、二重起動を避ける。
on:
  workflow_call:
    inputs:
      website_ref:
        description: 'ecauth-website の ref。空ならデフォルトブランチ（main）'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      website_ref:
        description: 'ecauth-website の ref（例: feat/signup-form）。空ならデフォルトブランチ（main）'
        type: string
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: <YourStrong@Passw0rd>
      # MockIdP URL は secrets から取得（リポジトリにはコミットしない）
      MOCK_IDP_BASE_URL: ${{ secrets.MOCK_IDP_BASE_URL }}
      MOCK_IDP_ORG: dev

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: ${{ env.DB_PASSWORD }}
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Account 申込・マジックリンクの実メール経路を検証するための SMTP 受信サーバー。
      # アプリは Email__Provider=Smtp で mailpit:1025 へ送信し、E2E は REST API（8025）で
      # 本文からトークンを取得する。
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load base environment variables
        run: |
          # E2E 用の非機密のローカル/ダミー設定値（旧 .env.dist 相当）。
          # クレデンシャルは含まない。MOCK_IDP_BASE_URL はジョブレベルの env で
          # secrets から供給する（ここに既定値を書くと $GITHUB_ENV が
          # ジョブレベル env を上書きしてしまい、供給元が二重化する）。変数展開を含む値（FEDERATE_OAUTH2_* / STAGING_MOCK_IDP_*_ENDPOINT）は
          # 旧 .env.dist でも除外されていたため、ここでも展開済みの値を後続 step で組み立てる。
          # 注意: 以下の heredoc は $GITHUB_ENV に追記されるため KEY=value 行のみ許容。
          # コメント行を混ぜると「Invalid format」で step が失敗する（Account/mailpit 系の
          # 説明はこのブロック外に置く）。ACCOUNTS_* は AccountsOrganizationSeeder が accounts
          # Org + 管理コンソール Client を投入するために必須。ACCOUNTS_CLIENT_PUBLIC=true は
          # 管理コンソールを public client(PKCE) として投入する指定で、account_signup_flow spec は
          # client_secret を使わず code_verifier でトークン交換するため必要（未設定だと Seeder 既定の
          # false = confidential になり CI だけ落ちる）。Email__Provider=Smtp / Smtp__* は
          # 申込・マジックリンクの実メール経路を mailpit で検証するための切替。
          cat <<'EOF' >> $GITHUB_ENV
          DB_HOST=db
          MIGRATION_DB_HOST=localhost
          DB_NAME=EcAuthDb
          DB_USER=SA
          DB_PASSWORD='<YourStrong@Passw0rd>'
          STATE_PASSWORD='<strong_password_string_of_at_least_32_characters>'
          MOCK_IDP_DB_NAME=MockIdp
          MOCK_IDP_DEFAULT_USER_PASSWORD=password
          MOCK_IDP_DEFAULT_CLIENT_ID=mockclientid
          MOCK_IDP_DEFAULT_CLIENT_SECRET=mock-client-secret
          MOCK_IDP_DEFAULT_CLIENT_NAME=MockClient
          MOCK_IDP_DEFAULT_USER_EMAIL=defaultuser@example.com
          MOCK_IDP_FEDERATE_CLIENT_ID=federateclientid
          MOCK_IDP_FEDERATE_CLIENT_SECRET=federate-client-secret
          MOCK_IDP_FEDERATE_CLIENT_NAME=FederateClient
          MOCK_IDP_FEDERATE_USER_EMAIL=federate@example.jp
          FEDERATE_OAUTH2_APP_NAME=federate-oauth2
          DEFAULT_ORGANIZATION_CODE=example
          DEFAULT_ORGANIZATION_NAME=example
          DEFAULT_ORGANIZATION_TENANT_NAME=example
          DEFAULT_ORGANIZATION_REDIRECT_URI=https://localhost:8081/v1/auth/callback
          DEFAULT_CLIENT_ID=client_id
          DEFAULT_CLIENT_SECRET=client_secret
          DEFAULT_APP_NAME=app_name
          GOOGLE_OAUTH2_APP_NAME=google-oauth2
          GOOGLE_OAUTH2_CLIENT_ID=<Google OAuth2 client_id>
          GOOGLE_OAUTH2_CLIENT_SECRET=<Google OAuth2 client_secret>
          GOOGLE_OAUTH2_DISCOVERY_URL=https://accounts.google.com/.well-known/openid-configuration
          AMAZON_OAUTH2_APP_NAME=amazon-oauth2
          AMAZON_OAUTH2_CLIENT_ID=<Amazon OAuth2 client_id>
          AMAZON_OAUTH2_CLIENT_SECRET=<Amazon OAuth2 client_secret>
          AMAZON_OAUTH2_AUTHORIZATION_ENDPOINT=https://www.amazon.com/ap/oa
          AMAZON_OAUTH2_TOKEN_ENDPOINT=https://api.amazon.co.jp/auth/o2/token
          AMAZON_OAUTH2_USERINFO_ENDPOINT=https://api.amazon.com/user/profile
          STAGING_ORGANIZATION_CODE=staging
          STAGING_ORGANIZATION_NAME=staging
          STAGING_ORGANIZATION_TENANT_NAME=staging
          STAGING_CLIENT_ID=<staging_client_id>
          STAGING_CLIENT_SECRET=<staging_client_secret>
          STAGING_APP_NAME=EC-CUBE4 Staging
          STAGING_REDIRECT_URI=https://localhost:4430/callback
          STAGING_MOCK_IDP_APP_NAME=staging-mock-idp
          STAGING_MOCK_IDP_CLIENT_ID=<staging_mock_idp_client_id>
          STAGING_MOCK_IDP_CLIENT_SECRET=<staging_mock_idp_client_secret>
          DEV_B2B_USER_SUBJECT=3f7c0ab4-b004-4102-b6ed-a730369dd237
          DEV_B2B_USER_EXTERNAL_ID=test-admin
          DEV_B2B_REDIRECT_URI=https://localhost:8081/admin/ecauth/callback
          DEV_B2B_ALLOWED_RP_IDS=localhost
          ACCOUNTS_CLIENT_ID=ecauth-admin-console
          ACCOUNTS_CLIENT_PUBLIC=true
          ACCOUNTS_CLIENT_SECRET=accounts_client_secret
          ACCOUNTS_ALLOWED_RP_IDS=accounts.ec-auth.io,localhost
          ACCOUNTS_REDIRECT_URI=https://localhost:8081/auth/callback
          Signup__ConfirmBaseUrl__accounts=https://localhost:8081
          MagicLink__BaseUrl__accounts=https://localhost:8081
          Email__Provider=Smtp
          Smtp__Host=localhost
          Smtp__Port=1025
          EOF

      - name: Set up environment variables
        run: |
          echo "DB_HOST=localhost" >> $GITHUB_ENV
          echo "ConnectionStrings__EcAuthDbContext=Server=localhost;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true" >> $GITHUB_ENV
          # MockIdP エンドポイント（外部環境を使用）
          # ?org= パラメータはマルチテナント対応のMockIdPで必須
          echo "FEDERATE_OAUTH2_CLIENT_ID=${MOCK_IDP_FEDERATE_CLIENT_ID}" >> $GITHUB_ENV
          echo "FEDERATE_OAUTH2_CLIENT_SECRET=${MOCK_IDP_FEDERATE_CLIENT_SECRET}" >> $GITHUB_ENV
          echo "FEDERATE_OAUTH2_AUTHORIZATION_ENDPOINT=${MOCK_IDP_BASE_URL}/authorization?org=${MOCK_IDP_ORG}" >> $GITHUB_ENV
          echo "FEDERATE_OAUTH2_TOKEN_ENDPOINT=${MOCK_IDP_BASE_URL}/token?org=${MOCK_IDP_ORG}" >> $GITHUB_ENV
          echo "FEDERATE_OAUTH2_USERINFO_ENDPOINT=${MOCK_IDP_BASE_URL}/userinfo?org=${MOCK_IDP_ORG}" >> $GITHUB_ENV
          # E2Eテスト用の環境変数
          echo "E2E_AUTHORIZATION_ENDPOINT=https://localhost:8081/v1/authorization" >> $GITHUB_ENV
          echo "E2E_TOKEN_ENDPOINT=https://localhost:8081/v1/token" >> $GITHUB_ENV
          echo "E2E_USERINFO_ENDPOINT=${MOCK_IDP_BASE_URL}/userinfo?org=${MOCK_IDP_ORG}" >> $GITHUB_ENV
          echo "E2E_REDIRECT_URI=https://localhost:8081/v1/auth/callback" >> $GITHUB_ENV
          # MockIdP 単体テスト用
          echo "E2E_MOCK_IDP_REDIRECT_URI=http://localhost:8080/v1/auth/callback" >> $GITHUB_ENV
        env:
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          MOCK_IDP_FEDERATE_CLIENT_ID: ${{ env.MOCK_IDP_FEDERATE_CLIENT_ID }}
          MOCK_IDP_FEDERATE_CLIENT_SECRET: ${{ env.MOCK_IDP_FEDERATE_CLIENT_SECRET }}
          # 供給元は secrets の一本のみ（ジョブレベル env と同じ値を明示）
          MOCK_IDP_BASE_URL: ${{ secrets.MOCK_IDP_BASE_URL }}
          MOCK_IDP_ORG: ${{ env.MOCK_IDP_ORG }}

      # --- ecauth-website（フロント）の配信 ---
      # website_signup_flow.spec.ts が「フロント → 実 API」の結合を検証するために、
      # ecauth-website を hugo server で https://ec-auth.io:1313 に配信する。
      # 別リポジトリへのアクセス権が無い環境でも EcAuth 本体の E2E は回るよう、
      # checkout 失敗は job を落とさず、その場合は当該 spec がスキップされる（警告を出す）。
      - name: Checkout ecauth-website
        id: checkout_website
        continue-on-error: true
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: EcAuth/ecauth-website
          # 空文字ならデフォルトブランチ。申込／マイページが未マージの間は
          # workflow_dispatch で website_ref にそのブランチを指定して検証する。
          ref: ${{ inputs.website_ref }}
          path: ecauth-website
          token: ${{ secrets.ORG_PAT || secrets.PACKAGES_READ_TOKEN || github.token }}

      # checkout できても、その ref に申込／マイページのテンプレートが無ければ
      # 結合 E2E は回せない（未マージのデフォルトブランチなど）。ここで判定しておかないと
      # hugo は起動するが全ページ 404 になり、テストが不可解なタイムアウトで落ちる。
      - name: Check ecauth-website has the app pages
        id: website_ready
        if: steps.checkout_website.outcome == 'success'
        run: |
          missing=""
          for f in layouts/_default/signup.html layouts/_default/mypage.html layouts/_default/auth-callback.html; do
            [ -f "ecauth-website/$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::warning title=website E2E skipped::ecauth-website の ref に申込/マイページのテンプレートがありません（未マージ）:$missing"
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Hugo
        if: steps.website_ready.outputs.ready == 'true'
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: 'latest'
          extended: true

      - name: Configure frontend wiring
        if: steps.website_ready.outputs.ready == 'true'
        run: |
          # PKCE（crypto.subtle）は secure context 必須。ec-auth.io は localhost 扱いされないため
          # フロントは HTTPS で配信する。証明書は自己署名で、Playwright 側が ignoreHTTPSErrors。
          WEBSITE_BASE="https://ec-auth.io:1313"
          echo "E2E_WEBSITE_BASE_URL=${WEBSITE_BASE}" >> $GITHUB_ENV
          # フロントの配信元（PasskeyPageController のマイページ遷移先）
          echo "Frontend__BaseUrl=${WEBSITE_BASE}" >> $GITHUB_ENV
          # CORS は scheme+host+port の完全一致比較なのでポートまで含める
          echo "Signup__AllowedOrigins__0=${WEBSITE_BASE}" >> $GITHUB_ENV
          # 確認メール / マジックリンクの着地先をフロントに向ける
          echo "Signup__ConfirmBaseUrl__accounts=${WEBSITE_BASE}" >> $GITHUB_ENV
          echo "MagicLink__BaseUrl__accounts=${WEBSITE_BASE}" >> $GITHUB_ENV
          # 管理コンソール Client の redirect_uri（Seeder が登録する値）をフロントの callback に揃える。
          # account_signup_flow.spec.ts も同じ env を参照するため、両 spec で登録値が一致する。
          echo "ACCOUNTS_REDIRECT_URI=${WEBSITE_BASE}/auth/callback" >> $GITHUB_ENV

      - name: Warn when ecauth-website is unavailable
        if: steps.checkout_website.outcome != 'success'
        run: |
          echo "::warning title=website E2E skipped::ecauth-website を checkout できなかったため、website_signup_flow.spec.ts はスキップされます（フロント × 実 API の結合は未検証）。"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Add GitHub Packages source with credentials
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source https://nuget.pkg.github.com/EcAuth/index.json \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.ORG_PAT || secrets.PACKAGES_READ_TOKEN }} \
            --store-password-in-clear-text

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Install dependencies
        run: dotnet restore ./EcAuth.sln

      - name: Build IdentityProvider
        run: dotnet build --no-restore --configuration Release IdentityProvider

      - name: Migrate IdentityProvider DB
        working-directory: IdentityProvider
        run: |
          dotnet ef database update
          # データベースが完全に起動するまで待機
          echo "Waiting for database to be fully online..."
          sleep 10

      - name: Start IdentityProvider
        run: |
          export ASPNETCORE_HTTPS_PORT=8081
          export ASPNETCORE_URLS="https://0.0.0.0:8081"
          # ログファイルに出力しながらバックグラウンドで起動
          dotnet run --project IdentityProvider --configuration Release --urls "https://0.0.0.0:8081" > /tmp/identityprovider.log 2>&1 &
          echo $! > /tmp/identityprovider.pid
          echo "IdentityProvider started with PID: $(cat /tmp/identityprovider.pid)"
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - name: Wait for IdentityProvider to start
        run: |
          echo "Waiting for IdentityProvider to start..."
          for i in {1..60}; do
            if curl -sk https://localhost:8081/healthz > /dev/null 2>&1; then
              echo "IdentityProvider is ready"
              # 追加の安定待機時間
              sleep 5
              break
            fi
            # 起動に失敗した場合のログ出力
            if [ $i -eq 30 ]; then
              echo "=== IdentityProvider logs (intermediate check) ==="
              cat /tmp/identityprovider.log || echo "No logs available"
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          # 最終確認
          if ! curl -sk https://localhost:8081/healthz > /dev/null 2>&1; then
            echo "ERROR: IdentityProvider failed to start"
            echo "=== IdentityProvider logs ==="
            cat /tmp/identityprovider.log || echo "No logs available"
            exit 1
          fi

      - name: Start ecauth-website (hugo)
        if: steps.website_ready.outputs.ready == 'true'
        working-directory: ecauth-website
        env:
          # hugo.toml の既定値を E2E 環境に上書きする（baseof.html が window.ECAUTH に注入）。
          HUGO_PARAMS_APIBASEURL: https://accounts.ec-auth.io:8081
          HUGO_PARAMS_AUTHREDIRECTURI: https://ec-auth.io:1313/auth/callback
        run: |
          hugo server --tlsAuto --bind 127.0.0.1 --port 1313 \
            --baseURL https://ec-auth.io:1313/ --appendPort=false --disableFastRender \
            > /tmp/hugo.log 2>&1 &
          echo $! > /tmp/hugo.pid
          # -f を付けて 2xx 以外を失敗にする。-f 無しだと 404 でも exit 0 になり、
          # 「hugo は起動したが全ページ 404」を ready と誤判定してしまう。
          for i in {1..30}; do
            if curl -fsk https://127.0.0.1:1313/signup/ -o /dev/null; then
              echo "ecauth-website is ready"
              break
            fi
            echo "Waiting for hugo... ($i/30)"
            sleep 2
          done
          # E2E が実際に開くページが 200 で返ることまで確認する。
          failed=""
          for path in /signup/ /signup/confirm/ /signin/ /signin/magic-link/ /mypage/ /auth/callback/; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://127.0.0.1:1313${path}")
            echo "  ${path} -> ${code}"
            [ "$code" = "200" ] || failed="$failed ${path}(${code})"
          done
          if [ -n "$failed" ]; then
            echo "ERROR: ecauth-website のページが 200 を返しません:$failed"
            cat /tmp/hugo.log || true
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: E2ETests/package.json

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: E2ETests
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: E2ETests
        run: pnpm exec playwright test
        env:
          # secrets から直接参照（env経由では空になるため）
          MOCK_IDP_BASE_URL: ${{ secrets.MOCK_IDP_BASE_URL }}
          MOCK_IDP_ORG: ${{ env.MOCK_IDP_ORG }}
          E2E_MOCK_IDP_REDIRECT_URI: ${{ env.E2E_MOCK_IDP_REDIRECT_URI }}

      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: 'E2ETests/test-results/'

      - name: Display IdentityProvider logs
        if: always()
        run: |
          echo "=== IdentityProvider logs ==="
          cat /tmp/identityprovider.log || echo "No logs available"
          echo "=== .NET exception logs ==="
          cat IdentityProvider/logs/*.log 2>/dev/null || echo "No exception logs found"
          echo "=== ecauth-website (hugo) logs ==="
          cat /tmp/hugo.log 2>/dev/null || echo "No hugo logs (website E2E not run)"
