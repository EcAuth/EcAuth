name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # 起動条件: 組織メンバー/コラボレーター/オーナーが @claude メンションした場合のみ。
    # （旧条件 `github.repository_owner == github.actor` は組織リポジトリでは
    #   owner=組織名 / actor=ユーザー名 となり常に false になるため author_association で判定する）
    if: |
      (
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
          (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
          (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
       )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      # EcAuthDocs は private なので checkout に token が要る。GITHUB_TOKEN は自リポジトリ
      # にしか効かないため、contents: read を EcAuthDocs 1 つだけに絞った GitHub App
      # (EcAuth Docs Reader) の installation token を使う。秘密鍵は 1Password が一次情報で、
      # GitHub 側にはサービスアカウントトークンしか置かない。
      #
      # actions: write を持つ App (EcAuth Workflow Dispatcher) と分けてあるのは、この
      # ジョブが public リポジトリで issue 本文を LLM に読ませる構造だからで、仮に
      # プロンプトインジェクションが通っても最悪ケースが「EcAuthDocs を読む」= 本来の
      # 用途に留まる。1 つの App にまとめて発行時に絞る形では、鍵そのものが両方の権限を
      # 持つため、この境界は成立しない。
      - name: Load GitHub App credentials from 1Password
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOCS_READER_CLIENT_ID: op://EcAuth/github-app-docs-reader/client_id
          DOCS_READER_PRIVATE_KEY: op://EcAuth/github-app-docs-reader/private_key
      - name: Create EcAuthDocs access token
        id: docs-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.DOCS_READER_CLIENT_ID }}
          private-key: ${{ env.DOCS_READER_PRIVATE_KEY }}
          owner: EcAuth
          # App は EcAuthDocs にしか install していないが、発行するトークン側でも対象と
          # 権限を明示する。install 先が将来増えても、この 2 行を直さない限りトークンの
          # 届く範囲は広がらない。
          repositories: EcAuthDocs
          permission-contents: read
      - name: Checkout EcAuthDocs repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: EcAuth/EcAuthDocs
          path: docs
          fetch-depth: 1
          token: ${{ steps.docs-token.outputs.token }}
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Add GitHub Packages source with credentials
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source https://nuget.pkg.github.com/EcAuth/index.json \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Restore dependencies
        run: dotnet restore ./EcAuth.sln

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1.0.159
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools Bash'
