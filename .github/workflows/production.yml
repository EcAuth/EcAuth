name: Production Deploy & Migrate

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - migrate-and-deploy
          - deploy-only
          - migrate-only
          # デプロイせず verify だけを回す。ecauth-infrastructure の apply 後（アプリを
          # 再デプロイしないが app_settings や DNS は変わる）に、外から叩くための入口。
          # dry_run は既定 true なので、verify を動かすには dry_run=false を明示すること。
          - verify-only
        default: 'migrate-and-deploy'
      dry_run:
        description: 'Dry run (generate migration script only, skip deploy and verify)'
        required: false
        type: boolean
        default: true

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_PACKAGE_PATH: ./publish

jobs:
  migrate:
    if: contains(fromJSON('["migrate-only", "migrate-and-deploy"]'), inputs.action)
    runs-on: ubuntu-latest
    environment:
      name: production

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load secrets from 1Password
        id: load_secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # Azure SQL Database credentials
          SQL_HOST: op://EcAuth/ecauth-prod-sql/hostname
          SQL_DATABASE: op://EcAuth/ecauth-prod-sql/database
          SQL_USERNAME: op://EcAuth/ecauth-prod-sql/username
          SQL_PASSWORD: op://EcAuth/ecauth-prod-sql/password
          # Production Organization/Client settings (for migration data)
          PROD_ORGANIZATION_CODE: op://EcAuth/ecauth-prod-app/organization_code
          PROD_ORGANIZATION_NAME: op://EcAuth/ecauth-prod-app/organization_name
          PROD_ORGANIZATION_TENANT_NAME: op://EcAuth/ecauth-prod-app/organization_tenant_name
          PROD_CLIENT_ID: op://EcAuth/ecauth-prod-app/client_id
          PROD_CLIENT_SECRET: op://EcAuth/ecauth-prod-app/client_secret
          PROD_APP_NAME: op://EcAuth/ecauth-prod-app/app_name
          PROD_REDIRECT_URI: op://EcAuth/ecauth-prod-app/redirect_uri
          # Production MockIdP settings
          PROD_MOCK_IDP_APP_NAME: op://EcAuth/ecauth-prod-mockidp/app_name
          PROD_MOCK_IDP_CLIENT_ID: op://EcAuth/ecauth-prod-mockidp/client_id
          PROD_MOCK_IDP_CLIENT_SECRET: op://EcAuth/ecauth-prod-mockidp/client_secret
          PROD_MOCK_IDP_AUTHORIZATION_ENDPOINT: op://EcAuth/mockidp-production/authorization_endpoint
          PROD_MOCK_IDP_TOKEN_ENDPOINT: op://EcAuth/mockidp-production/token_endpoint
          PROD_MOCK_IDP_USERINFO_ENDPOINT: op://EcAuth/mockidp-production/userinfo_endpoint
          # B2B Passkey settings
          PROD_B2B_USER_SUBJECT: op://EcAuth/ecauth-prod-app/b2b_user_subject
          PROD_B2B_USER_EXTERNAL_ID: op://EcAuth/ecauth-prod-app/b2b_user_external_id
          PROD_B2B_REDIRECT_URI: op://EcAuth/ecauth-prod-app/b2b_redirect_uri
          PROD_B2B_ALLOWED_RP_IDS: op://EcAuth/ecauth-prod-app/b2b_allowed_rp_ids
          # Account management settings (accounts / stg-accounts Org)
          # 実際のランタイム注入は Terraform app_settings (Phase E)。ここは CI 配線。
          ACCOUNTS_CLIENT_ID: op://EcAuth/ecauth-prod-app/accounts_client_id
          ACCOUNTS_CLIENT_SECRET: op://EcAuth/ecauth-prod-app/accounts_client_secret
          ACCOUNTS_ALLOWED_RP_IDS: op://EcAuth/ecauth-prod-app/accounts_allowed_rp_ids
          ACCOUNTS_REDIRECT_URI: op://EcAuth/ecauth-prod-app/accounts_redirect_uri
          STG_ACCOUNTS_CLIENT_ID: op://EcAuth/ecauth-prod-app/stg_accounts_client_id
          STG_ACCOUNTS_CLIENT_SECRET: op://EcAuth/ecauth-prod-app/stg_accounts_client_secret
          STG_ACCOUNTS_ALLOWED_RP_IDS: op://EcAuth/ecauth-prod-app/stg_accounts_allowed_rp_ids
          STG_ACCOUNTS_REDIRECT_URI: op://EcAuth/ecauth-prod-app/stg_accounts_redirect_uri
          # 管理コンソールを public client(PKCE) として投入するフラグ。非秘密のため
          # 1Password ではなくリテラルで配線する（AccountsOrganizationSeeder が起動時に参照）。
          #
          # 有効化の前提条件（マジックリンク×PKCE の解決・account 系 E2E の PKCE 対応）は
          # 解消済みだが、本番はまだ false に据え置く。理由:
          #   - 本ブロックは CI 配線であり、ランタイムへ流す step は無い（実際の注入は
          #     Terraform app_settings）。ここだけ true にしても本番の挙動は変わらず、
          #     「CI は true / Terraform は false / 実挙動は confidential」の三者不一致になる
          #   - true にするとシーダーが本番 Client の client_secret を消去する破壊的変更のため、
          #     Terraform 配線および ecauth-website の公開と順序を合わせて実施する
          # → 有効化は infra 側 PR（staging → production 順）と同一タイミングで行う。
          ACCOUNTS_CLIENT_PUBLIC: "false"
          STG_ACCOUNTS_CLIENT_PUBLIC: "false"
          # Email delivery (signup / magic-link, Phase D)
          SENDGRID_API_KEY: op://EcAuth/ecauth-prod-app/sendgrid_api_key
          # Staging variables (required for idempotent script generation of staging migration)
          STAGING_ORGANIZATION_CODE: op://EcAuth/ecauth-staging-app/organization_code
          STAGING_ORGANIZATION_NAME: op://EcAuth/ecauth-staging-app/organization_name
          STAGING_ORGANIZATION_TENANT_NAME: op://EcAuth/ecauth-staging-app/organization_tenant_name
          STAGING_CLIENT_ID: op://EcAuth/ecauth-staging-app/client_id
          STAGING_CLIENT_SECRET: op://EcAuth/ecauth-staging-app/client_secret
          STAGING_APP_NAME: op://EcAuth/ecauth-staging-app/app_name
          STAGING_REDIRECT_URI: op://EcAuth/ecauth-staging-app/redirect_uri
          STAGING_MOCK_IDP_APP_NAME: op://EcAuth/ecauth-staging-mockidp/app_name
          STAGING_MOCK_IDP_CLIENT_ID: op://EcAuth/ecauth-staging-mockidp/client_id
          STAGING_MOCK_IDP_CLIENT_SECRET: op://EcAuth/ecauth-staging-mockidp/client_secret
          STAGING_MOCK_IDP_AUTHORIZATION_ENDPOINT: op://EcAuth/mockidp-staging/authorization_endpoint
          STAGING_MOCK_IDP_TOKEN_ENDPOINT: op://EcAuth/mockidp-staging/token_endpoint
          STAGING_MOCK_IDP_USERINFO_ENDPOINT: op://EcAuth/mockidp-staging/userinfo_endpoint
          # Azure credentials
          AZURE_CLIENT_ID: op://EcAuth/ecauth-workload-identity/AZURE_CLIENT_ID
          AZURE_TENANT_ID: op://EcAuth/ecauth-workload-identity/AZURE_TENANT_ID
          AZURE_SUBSCRIPTION_ID: op://EcAuth/ecauth-workload-identity/AZURE_SUBSCRIPTION_ID

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add GitHub Packages source with credentials
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source https://nuget.pkg.github.com/EcAuth/index.json \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore IdentityProvider/IdentityProvider.csproj

      - name: Build
        run: dotnet build IdentityProvider/IdentityProvider.csproj --configuration Release --no-restore

      - name: Generate migration script
        run: |
          cd IdentityProvider
          dotnet ef migrations script --idempotent --output ../migration.sql
          echo "Generated migration script:"
          cat ../migration.sql

      - name: Upload migration script as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-script
          path: migration.sql
          retention-days: 30

      - name: Build connection string
        id: connection
        run: |
          CONNECTION_STRING="Server=tcp:${SQL_HOST},1433;Initial Catalog=${SQL_DATABASE};User ID=${SQL_USERNAME};Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
          echo "::add-mask::${CONNECTION_STRING}"
          echo "connection_string=${CONNECTION_STRING}" >> $GITHUB_OUTPUT

      - name: Login to Azure
        if: ${{ inputs.dry_run != true }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Apply migration to production database
        if: ${{ inputs.dry_run != true }}
        uses: azure/sql-action@eb1f9a80487ca52b90f41a473f53da4943526994 # v2.4
        with:
          connection-string: ${{ steps.connection.outputs.connection_string }}
          path: ./migration.sql

      - name: Verify migration applied
        if: ${{ inputs.dry_run != true }}
        run: |
          # マイグレーションファイル名からDB接続なしで最新のMigrationIdを取得
          LATEST_MIGRATION=$(ls -1 IdentityProvider/Migrations/*.cs | grep -v Designer | grep -v Snapshot | sed 's/.*\///' | sed 's/_.*//' | sort | tail -1)
          LATEST_MIGRATION_ID=$(ls -1 IdentityProvider/Migrations/${LATEST_MIGRATION}_*.cs | grep -v Designer | sed 's/.*\///' | sed 's/\.cs$//')
          echo "Latest migration: ${LATEST_MIGRATION_ID}"
          sqlcmd -S "tcp:${SQL_HOST},1433" -d "${SQL_DATABASE}" -U "${SQL_USERNAME}" -P "${SQL_PASSWORD}" -C -b -Q \
            "IF NOT EXISTS (SELECT 1 FROM [__EFMigrationsHistory] WHERE [MigrationId] = '${LATEST_MIGRATION_ID}') THROW 50000, 'Migration ${LATEST_MIGRATION_ID} was not applied', 1;"
          echo "Migration verification passed: ${LATEST_MIGRATION_ID} exists in __EFMigrationsHistory"

      - name: Dry run - Skip migration apply
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run mode enabled. Migration script was generated but not applied."
          echo "Review the migration script artifact before running without dry_run."

  build:
    if: contains(fromJSON('["deploy-only", "migrate-and-deploy"]'), inputs.action)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add GitHub Packages source with credentials
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source https://nuget.pkg.github.com/EcAuth/index.json \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore IdentityProvider/IdentityProvider.csproj

      - name: Build
        # /healthz の version に git SHA を埋める（デプロイ後の verify が新ビルドの稼働を判定する）。
        run: dotnet build IdentityProvider/IdentityProvider.csproj --configuration Release --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Publish
        run: dotnet publish IdentityProvider/IdentityProvider.csproj --configuration Release --no-build --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    needs: [build, migrate]
    if: |
      always() &&
      inputs.dry_run != true &&
      needs.build.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AZURE_CLIENT_ID: op://EcAuth/ecauth-workload-identity/AZURE_CLIENT_ID
          AZURE_TENANT_ID: op://EcAuth/ecauth-workload-identity/AZURE_TENANT_ID
          AZURE_SUBSCRIPTION_ID: op://EcAuth/ecauth-workload-identity/AZURE_SUBSCRIPTION_ID
          WEB_APP_SUFFIX: op://EcAuth/ecauth-prod-app/web_app_suffix

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ecauth-prod-${{ env.WEB_APP_SUFFIX }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Health check
        env:
          HEALTH_CHECK_URL: https://production.ec-auth.io/healthz
          # /healthz は新旧両方のコードに存在するため、デプロイ伝播中は旧リビジョンでも 200 を返す。
          # 新コードが live になったことを保証するため、新設エンドポイント Discovery の 200 も合わせて待つ。
          DISCOVERY_URL: https://production.ec-auth.io/.well-known/openid-configuration
          # /healthz は CanConnectAsync の軽量チェックのみで実 DB クエリ経路を温めない。
          # JWKS は実際に DB を引くため、ここで 200 を待つことで verify 実行前に DB を
          # ウォームアップし、コールド DB によるオリジンタイムアウト(Cloudflare 524)を防ぐ。
          JWKS_URL: https://production.ec-auth.io/.well-known/jwks.json
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30
          for i in {1..10}; do
            health=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$HEALTH_CHECK_URL" || echo "000")
            discovery=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$DISCOVERY_URL" || echo "000")
            jwks=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$JWKS_URL" || echo "000")
            if [ "$health" = "200" ] && [ "$discovery" = "200" ] && [ "$jwks" = "200" ]; then
              echo "Health check passed! (healthz=200, discovery=200, jwks=200)"
              exit 0
            fi
            echo "Attempt $i: healthz=$health discovery=$discovery jwks=$jwks, retrying in 30 seconds..."
            sleep 30
          done
          echo "Health check failed after 10 attempts (last: healthz=$health discovery=$discovery jwks=$jwks)"
          exit 1

  verify:
    needs: deploy
    # verify-only のときは deploy が skipped になる。デプロイ直後の検証と、
    # インフラ変更後の検証（アプリは変わらないが設定は変わる）を同じジョブで賄う。
    if: |
      always() &&
      inputs.dry_run != true &&
      (needs.deploy.result == 'success' ||
       (inputs.action == 'verify-only' && needs.deploy.result == 'skipped'))
    runs-on: ubuntu-latest
    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            E2ETests

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          MOCK_USER: op://EcAuth/mockidp-production/default_user_email
          MOCK_PASS: op://EcAuth/mockidp-production/default_user_password
          CLIENT_ID: op://EcAuth/ecauth-prod-app/client_id
          CLIENT_SECRET: op://EcAuth/ecauth-prod-app/client_secret
          MOCK_IDP_PROVIDER_NAME: op://EcAuth/ecauth-prod-mockidp/app_name
          B2B_USER_SUBJECT: op://EcAuth/ecauth-prod-app/b2b_user_subject
          B2B_REDIRECT_URI: op://EcAuth/ecauth-prod-app/b2b_redirect_uri
          WEB_APP_SUFFIX: op://EcAuth/ecauth-prod-app/web_app_suffix
          # B2C フェデレーション検証の redirect_uri。/v1/authorization が登録値と完全一致で
          # 検証する（EcAuthDocs#100）ため、Terraform が DEFAULT_ORGANIZATION_REDIRECT_URI として
          # 配線し OrganizationClientSeeder が client に登録するのと同じフィールドを渡す。
          REDIRECT_URI: op://EcAuth/ecauth-prod-app/redirect_uri
          # 申込スモーク（stg-accounts テナント）。本物の顧客が入る accounts テナントは使わない。
          # stg-accounts の管理コンソール Client は confidential（STG_ACCOUNTS_CLIENT_PUBLIC が
          # 設定されていない）ため、PKCE に加えて client_secret も要る。
          STG_ACCOUNTS_CLIENT_ID: op://EcAuth/ecauth-prod-app/stg_accounts_client_id
          STG_ACCOUNTS_CLIENT_SECRET: op://EcAuth/ecauth-prod-app/stg_accounts_client_secret
          STG_ACCOUNTS_REDIRECT_URI: op://EcAuth/ecauth-prod-app/stg_accounts_redirect_uri
          # 確認メールの受信口（SendGrid Inbound Parse → Cloudflare Worker）。
          # 詳細は ecauth-infrastructure の CLAUDE.md「E2E 用メールボックス」。
          E2E_MAILBOX_TOKEN: op://EcAuth/ecauth-e2e-mailbox/api_token

      # デプロイ直後はコンテナ入れ替え中で最初のリクエストが 10〜25 秒かかり、signup smoke の
      # waitForURL（20 秒）がサーバー応答より先に切れる（EcAuth#530 / #531 の本番適用で 2 回連続）。
      # いずれもサーバー側の処理自体は成功しており、テスト側のタイムアウトだけが赤くなっていた。
      #
      # EcAuth#532 の本番適用では、さらに次の 2 点が判明した:
      #   - deploy ジョブ完了後も旧コンテナが応答し続ける窓があり（verify 開始後 10 秒近く）、
      #     ここで温めても「温めたのは旧ビルド、E2E が当たるのは冷えた新ビルド」になる
      #   - 新ビルドの初回復号は Key Vault の鍵 GET 401 → MSI トークン取得（5.5 秒）→ 復号で 8 秒超かかり、
      #     /healthz を叩いても温まらない（DB 疎通しか通らない）
      # そのため、まず /healthz の version（CI が -p:SourceRevisionId で埋めた git SHA）で新ビルドの
      # 稼働を確認し、secret_protector（起動時の SecretProtectorWarmupService が Key Vault を 1 往復した
      # 結果）が warm になるまで待ってから、各ホストの応答が速くなるまで叩く。
      #
      # テナント解決と EF のクエリプランはホスト（テナント）ごとに温まるため、production だけでなく
      # signup smoke が使う stg-accounts も叩く。応答時間の温まりについては、温まりきらなくてもジョブは
      # 落とさない（本来の検証は後続の E2E であり、ここで失敗させると切り分けが減る）。
      # 一方、新ビルドの稼働が確認できない場合はジョブを落とす。そのまま進むと E2E が旧ビルドを検証して
      # 「デプロイが検証された」という偽陽性になるため。
      # verify-only はデプロイを伴わない（稼働中のビルドが github.sha と一致する保証が無い）ので、
      # 新ビルドの待ち合わせはスキップして応答時間の温まりだけ行う。
      - name: Warm up endpoints
        if: ${{ !cancelled() }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          ACTION: ${{ inputs.action }}
        run: |
          # 新ビルドが応答し、Key Vault 経路が温まるまで待つ。
          # 旧コンテナと新コンテナが同居する窓では応答が交互に返りうるので、新ビルドの応答を
          # 3 回連続で確認する（curl は毎回新規接続なので keep-alive で旧に張り付くことはない）。
          #
          # この判定は本番が 1 インスタンス（B1、ecauth-infrastructure の production/main.tf）である
          # ことを前提にしている。単一インスタンスでは新コンテナが応答し始めた時点で経路が切り替わり、
          # 旧は処理中のリクエストを終えて止まる（EcAuth#532 の本番適用で SQL 監査上も交互応答は無かった）。
          # スケールアウトして複数インスタンスがロードバランスされる構成になると、3 連続の新ビルド応答は
          # 「新インスタンスが 1 つ以上ある」ことしか示さず、旧インスタンスの残存を否定できない。
          # その場合は deploy ジョブ側でデプロイ状態 API（numberOfInstancesSuccessful 等）を使い、
          # 全インスタンスのロールアウト完了を待つ形に変える（EcAuthDocs#137）。
          wait_for_new_build() {
            url="$1"; label="$2"; streak=0
            for i in $(seq 1 60); do
              body=$(curl -s --max-time 30 "$url" || true)
              version=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)
              sp=$(printf '%s' "$body" | jq -r '.secret_protector // empty' 2>/dev/null || true)
              echo "[$label] attempt $i: version=${version:-?} secret_protector=${sp:-?}"
              case "$version" in
                *+"$EXPECTED_SHA") streak=$((streak + 1)) ;;
                *) streak=0 ;;
              esac
              if [ "$streak" -ge 3 ]; then
                # warm: 温まった / n/a: Key Vault 未使用 / failed: 温まらないので待っても無駄
                case "$sp" in
                  warm|n/a|failed)
                    echo "[$label] new build is live (secret_protector=$sp)"
                    return 0 ;;
                esac
              fi
              sleep 5
            done
            echo "::error::[$label] 新ビルドの稼働を確認できませんでした（version が $EXPECTED_SHA に一致しない）。E2E が旧ビルドを検証するのを避けるため中断します。"
            return 1
          }

          warm() {
            url="$1"; label="$2"
            for i in $(seq 1 12); do
              start=$(date +%s%3N)
              # curl の終了状態と HTTP ステータスは別々に見る。`|| echo 000` で受けると
              # 接続失敗時に -w の "000" と連結されて "000\n000" になり失敗判定をすり抜ける。
              # 対象は全て正常時 200（/healthz は DB 未接続で 503、/passkey/register は View）
              # なので、5xx や接続失敗をコールドスタート中に「温まった」とみなさないよう 200 を要求する。
              if code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url"); then
                curl_ok=true
              else
                code=000
                curl_ok=false
              fi
              ms=$(( $(date +%s%3N) - start ))
              echo "[$label] attempt $i: HTTP $code in ${ms}ms"
              if [ "$curl_ok" = true ] && [ "$code" = "200" ] && [ "$ms" -lt 2000 ]; then
                echo "[$label] warmed up"
                return 0
              fi
              sleep 3
            done
            echo "[$label] 温まりきりませんでした（続行します）"
          }

          if [ "$ACTION" = "verify-only" ]; then
            echo "[production/build] verify-only はデプロイを伴わないため、新ビルドの待ち合わせをスキップします"
          else
            wait_for_new_build "https://production.ec-auth.io/healthz" "production/build"
          fi
          warm "https://production.ec-auth.io/healthz" "production/healthz"
          warm "https://stg-accounts.ec-auth.io/healthz" "stg-accounts/healthz"
          warm "https://stg-accounts.ec-auth.io/passkey/register" "stg-accounts/passkey-register"

      - name: Federation authentication verification
        id: federation_verify
        env:
          ECAUTH_REDIRECT_URI: ${{ env.REDIRECT_URI }}
          ECAUTH_BASE_URL: https://production.ec-auth.io
        run: ./.github/scripts/verify-federation-auth.sh

      - name: Federation verification result
        if: always()
        run: |
          echo "Federation verification result: ${{ steps.federation_verify.outputs.result }}"
          if [ "${{ steps.federation_verify.outputs.result }}" = "success" ]; then
            echo "✅ User subject: ${{ steps.federation_verify.outputs.user_sub }}"
          else
            echo "❌ Failed at step: ${{ steps.federation_verify.outputs.failed_step }}"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: E2ETests/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: E2ETests
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: B2B passkey E2E verification
        id: b2b_verify
        working-directory: E2ETests
        env:
          E2E_BASE_URL: https://production.ec-auth.io
          DEFAULT_CLIENT_ID: ${{ env.CLIENT_ID }}
          DEFAULT_CLIENT_SECRET: ${{ env.CLIENT_SECRET }}
          DEV_B2B_ALLOWED_RP_IDS: production.ec-auth.io
          DEV_B2B_USER_SUBJECT: ${{ env.B2B_USER_SUBJECT }}
          DEV_B2B_REDIRECT_URI: ${{ env.B2B_REDIRECT_URI }}
        run: |
          set -o pipefail
          pnpm exec playwright test tests/specs/b2b_passkey_authentication.spec.ts --reporter=list --output test-results/b2b 2>&1 | tee playwright-output.txt

      # 申込 → client-resolve → B2B パスキー登録/認証 → トークン交換 を、実環境の設定で通す。
      # シード済み Client を使う b2b_passkey_authentication では守れない範囲を埋める:
      #   - 申込が登録する redirect_uri / allowed_rp_ids の初期値（EcAuth#481 の再発防止）
      #   - PlatformApi:BaseDomain とテナント解決が本番のホスト名で噛み合うこと
      #   - SendGrid 送信 → Inbound Parse → Worker の受信口が生きていること
      # EC-CUBE プラグイン実物を通す版は CI（main.yml）が担当する。イメージビルドで
      # 10 分前後かかるうえ、本番 DB に残る Organization が run あたり 2 倍になるため。
      #
      # 前段が落ちても切り分けられるよう、B2B verify の結果に関わらず実行する。
      - name: Signup smoke (申込 Client でのパスキーログイン)
        id: signup_smoke
        if: ${{ !cancelled() }}
        working-directory: E2ETests
        env:
          # 実ホスト名でテナントを解決する（Cloudflare 配下では Host ヘッダ差し替えが使えない）。
          E2E_TENANT_BASE_DOMAIN: ec-auth.io
          # 申込は stg-accounts テナントで行う。本物の顧客が入る accounts は使わない。
          E2E_ACCOUNTS_HOST: stg-accounts.ec-auth.io
          ACCOUNTS_CLIENT_ID: ${{ env.STG_ACCOUNTS_CLIENT_ID }}
          ACCOUNTS_CLIENT_SECRET: ${{ env.STG_ACCOUNTS_CLIENT_SECRET }}
          ACCOUNTS_REDIRECT_URI: ${{ env.STG_ACCOUNTS_REDIRECT_URI }}
          # 受信口を mailpit から E2E 用メールボックスへ切り替える。
          E2E_MAILBOX_KIND: e2e-mailbox
          E2E_MAILBOX_API_TOKEN: ${{ env.E2E_MAILBOX_TOKEN }}
        run: |
          set -o pipefail
          pnpm exec playwright test tests/specs/signup_client_b2b_login.spec.ts --reporter=list --output test-results/signup-smoke 2>&1 | tee signup-smoke-output.txt

      # Playwright は実行開始時に outputDir を空にするため、B2B E2E と signup smoke で同じ
      # test-results/ を使うと後段が前段の失敗成果物（スクリーンショット・error-context）を消す
      # （EcAuth#532 の本番 verify で「No files were found」になった原因）。--output で分けている。
      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b2b-e2e-test-results
          path: E2ETests/test-results/

      - name: B2B verification result
        if: always()
        run: |
          echo "### B2B Passkey E2E Verification" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.b2b_verify.outcome }}" = "success" ]; then
            echo "✅ B2B passkey E2E verification passed" | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "❌ B2B passkey E2E verification failed" | tee -a $GITHUB_STEP_SUMMARY
          fi
          if [ -f E2ETests/playwright-output.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat E2ETests/playwright-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo ""
            echo "--- Playwright Output ---"
            cat E2ETests/playwright-output.txt
          fi

      - name: Signup smoke result
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.signup_smoke.outcome }}
        run: |
          echo "### Signup Smoke (申込 Client でのパスキーログイン)" >> $GITHUB_STEP_SUMMARY
          case "$SMOKE_OUTCOME" in
            success) echo "✅ Signup smoke passed" | tee -a $GITHUB_STEP_SUMMARY ;;
            skipped) echo "⏭️ Signup smoke skipped" | tee -a $GITHUB_STEP_SUMMARY ;;
            *)       echo "❌ Signup smoke failed" | tee -a $GITHUB_STEP_SUMMARY ;;
          esac
          if [ -f E2ETests/signup-smoke-output.txt ]; then
            # 出力冒頭の [signup-smoke] 行に org_code / email が出る。
            # 本番 DB に残った E2E データを後から特定するときの手掛かりになる。
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat E2ETests/signup-smoke-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo ""
            echo "--- Signup Smoke Output ---"
            cat E2ETests/signup-smoke-output.txt
          fi
