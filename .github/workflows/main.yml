name: CI

# オーケストレーター。push / pull_request トリガーはここだけに置き、各テストスイートは
# reusable workflow（on: workflow_call）として呼び出す。これにより 1 回の CI 実行で
# 全スイートが駆動され、各スイートが個別に push / PR イベントで多重起動するのを防ぐ。
# （各スイートは workflow_dispatch も残しているので、Actions UI から個別に再実行できる。）
on:
  push:
  pull_request:
  workflow_dispatch:

# 最小権限: 全スイートで checkout / NuGet restore（GitHub Packages 読み取り）のみ。
# reusable workflow 側の GITHUB_TOKEN 権限はここで定義した値が上限になる。
permissions:
  contents: read
  packages: read

jobs:
  # 安価な fail-fast ゲート。ユニットテストと冪等マイグレーション検証を先に通し、
  # 失敗すれば高コストな E2E スイート（IdP 起動を伴う playwright / selenium）を
  # 起動せずに早期失敗させる。
  dotnet-tests:
    uses: ./.github/workflows/dotnet_tests.yml
    secrets: inherit

  # E2E スイート。dotnet-tests がグリーンになってから起動するが、互いには並列実行。
  #
  # Dependabot が起動した run では skip する。GitHub は Dependabot イベントの run に
  # Actions secrets を渡さず Dependabot secrets だけを渡すため、この 2 つが MockIdP の
  # エンドポイントを取りに行く load-secrets-action が OP_SERVICE_ACCOUNT_TOKEN 未設定で
  # 必ず失敗する（"Authentication error with environment variables"）。
  # https://docs.github.com/en/code-security/dependabot/troubleshooting-dependabot/troubleshooting-dependabot-on-github-actions
  #
  # 解決策として OP のサービスアカウントトークンを Dependabot secrets に置くことはしない。
  # 依存更新 PR の CI は「更新後の third-party コードを実行する」場であり、そこに
  # EcAuth vault 全体の読み取りを与えることになる。E2E はマージ後の main への push
  # （Dependabot 起動ではないので Actions secrets が渡る）で回るため、検知が事後になる
  # だけで検証自体は失われない。
  #
  # dotnet-tests と eccube-plugin-e2e は Dependabot run でも通るのでガードしない。前者は
  # GITHUB_TOKEN と Dependabot secret の PACKAGES_READ_TOKEN だけで足り、後者は
  # 1Password の step が install_source == 'package-api' のときしか動かないため。
  playwright:
    needs: dotnet-tests
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/playwright.yml
    secrets: inherit
  selenium:
    needs: dotnet-tests
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/selenium.yml
    secrets: inherit
  # EC-CUBE 4系 / 2系のプラグインを実際に動かす結合 E2E。
  # 申込が登録する初期値とプラグインが送る値のズレ（EcAuth#481）は、この経路でしか出ない。
  # EC-CUBE のイメージビルドと初回インストールで他スイートより時間がかかるが、
  # 本番に出てから気付く類の不具合なので PR 時に回す。
  # secrets: inherit ではなく、呼び出し先が実際に使う 3 つだけを明示的に渡す
  # （呼び出し先の workflow_call.secrets に契約として宣言してある）。
  # 他の 3 スイートは既存のまま inherit なので、揃えるのは別途行う。
  eccube-plugin-e2e:
    needs: dotnet-tests
    uses: ./.github/workflows/eccube_plugin_e2e.yml
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
