version: 2

# プライベートレジストリの認証設定
#
# ここだけは PAT が要る。理由は 2 つある。
#
#   1. dependabot.yml は静的な ${{secrets.X}} しか解決できず、GitHub App の
#      installation token を発行する step を挟めない。ワークフロー側で進めた
#      GITHUB_TOKEN 化・App token 化と同じ手が使えない。
#   2. GitHub Packages は fine-grained PAT に非対応。fine-grained PAT の権限一覧に
#      Packages は repository / organization どちらにも存在せず、NuGet レジストリの
#      ドキュメントも "only supports authentication using a personal access token
#      (classic)" と明記している。
#      https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-nuget-registry
#
# そのため classic PAT を使う。スコープは read:packages のみ（repo は不要 — private
# リポジトリのパッケージでも read:packages だけで読める）。classic PAT のスコープは
# リポジトリ単位に絞れないため、これが現時点での到達範囲の下限。GitHub が
# fine-grained PAT に Packages 権限を追加したら差し替える。
#
# 一次情報は 1Password の op://EcAuth/dependabot-packages-read/credential。
# PACKAGES_READ_TOKEN は EcAuth/EcAuth の repo レベル Dependabot secret
# （registries を使うのはこのリポジトリだけなので org レベルにはしない）。
registries:
  github-packages:
    type: nuget-feed
    url: https://nuget.pkg.github.com/EcAuth/index.json
    username: x-access-token
    password: ${{secrets.PACKAGES_READ_TOKEN}}

updates:
  # GitHub Actions の自動更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    # minor/patch と major の 2 PR に集約する。
    # patterns を "*" にしているのは、公式 actions/* 以外のサードパーティ
    # （anthropics/* 1password/* pnpm/* peaceiris/* nanasess/* 等）を
    # 取りこぼさないため。ベンダー別に patterns を切ると、列挙から漏れた
    # action がそのまま個別 PR として滞留する。
    groups:
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # .NET NuGet パッケージの自動更新
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/IdentityProvider"
      - "/IdentityProvider.Test"
      - "/E2ETests.Selenium"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "dotnet"
    commit-message:
      prefix: "chore"
      include: "scope"
    allow:
      - dependency-type: "all"
    # GitHub Packages の認証設定を参照
    registries:
      - github-packages
    # group を指定すると複数 directories の同一パッケージ更新が 1 PR に集約される
    groups:
      nuget-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # .NET ランタイム同梱パッケージの major 更新は、.NET 本体のメジャー移行と
    # 同時に IdpUtilities → MockIdP → EcAuth の順で進める必要があるため止める。
    # 手順は EcAuthDocs の claude-repository-guide.md
    # 「.NET メジャーバージョン移行の順序（標準手順）」を参照。
    # patch/minor（10.0.9 → 10.0.10 等）は通す。
    ignore:
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]

  # E2ETests の npm パッケージの自動更新
  - package-ecosystem: "npm"
    directory: "/E2ETests"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "e2e-tests"
    commit-message:
      prefix: "chore"
      include: "scope"
    # 開発依存関係も含める
    allow:
      - dependency-type: "all"
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
